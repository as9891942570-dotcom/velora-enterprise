services:
  postgres:
    image: postgres:16-alpine
    container_name: velora-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: velora
      POSTGRES_PASSWORD: velora_dev
      POSTGRES_DB: velora
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora -d velora"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
